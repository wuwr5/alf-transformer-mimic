[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alf-transformer"
version = "0.1.0"
description = "Transformer risk models for acute liver failure on MIMIC-IV"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Weirong Wu" }]
maintainers = [{ name = "Weirong Wu" }]
keywords = ["acute liver failure", "MIMIC-IV", "transformer", "clinical prediction"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "torch>=2.2",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]
# duckdb is only needed by scripts/01_build_cohort.py, not by the library itself
pipeline = ["duckdb>=0.10"]

[project.urls]
Homepage = "https://github.com/wuwr5/alf-transformer-mimic-v2"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
